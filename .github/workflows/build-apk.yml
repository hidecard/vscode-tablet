name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Explicit pre-build check, independent of build-apk.sh: a CI APK must
      # never be produced without the server assets. assets/vscode/ is
      # gitignored (only .gitkeep is in the repo), so a build that skipped
      # the fetch step would otherwise bundle an empty folder and fail on
      # the tablet with "Missing .../out/server-main.js".
      - name: Fetch and verify OpenVSCode Server assets
        run: |
          bash scripts/fetch-openvscode-assets.sh
          test -f assets/vscode/out/server-main.js
          test "$(find assets/vscode -type f | wc -l)" -gt 1000

      - name: Build arm64 release APK
        env:
          KEEP_RUNTIME: '0'
        run: bash scripts/build-apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-tablet-arm64-release
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
